<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 500px;
            border-collapse: collapse;
        }
        td, th{
            border: 1px solid black;
            padding: 10px
        }
        thead, tfoot{
            background-color: grey;
            color: white;
        }
        td.num{
            text-align: right;
        }
        caption{
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
        <table>
            <caption>População das Unidades Federativas</caption>
            <thead>
                <th scope="col">Estado</th>
                <th scope="col" style="width: 50px;">População</th>
            </thead>
            <tbody>
                <tr>
                    <td>São Paulo</td>
                    <td class="num">463742</td>
                </tr>
                <tr>
                    <td>Minas Gerais</td>
                    <td class="num">462462</td>
                </tr>
                <tr>
                    <td>Rio de Janeiro</td>
                    <td class="num">732364</td>
                </tr>
                <tr>
                    <td>Bahia</td>
                    <td class="num">674357</td>
                </tr>
                <tr>
                    <td>Paraná</td>
                    <td class="num">6237423</td>
                </tr>
                <tr>
                    <td>Rio Grande do Sul</td>
                    <td class="num">354234</td>
                </tr>
                <tr>
                    <td>Pernambuco</td>
                    <td class="num">653756</td>
                </tr>
                <tr>
                    <td>Ceará</td>
                    <td class="num">465465</td>
                </tr>
            </tbody>
            <tfoot>
                <th scope="row">Total de habitantes</th>
                <td class="num"><strong>756436756</strong></td>
            </tfoot>
        </table>
</body>
</html>
