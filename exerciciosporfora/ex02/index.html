<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Login</h1>
        <form action="cadastro.php" method="post" autocomplete="on">
            <div class="usuário">
                <p>
                    <label for="iusu">Usuário </label>
                    <input type="text" name="usu" id="iusu" required autocomplete="name" maxlength="20">
                </p>
            </div>
            <div class="senha">
                <p>
                    <label for="isenha">Senha</label>
                    <input type="password" name="senha" id="isenha" required autocomplete="current-password" minlength="8" maxlength="16">
                </p>
            </div>
            <div class="botao">
                <input type="submit" value="Login" class="enviar">
            </div>
        </form>
    </main>
</body>
</html>
